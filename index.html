<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Attendance System</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
}

header {
  background: #123c69;
  color: white;
  text-align: center;
  padding: 25px 10px;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 10px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

h2 {
  color: #123c69;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 5px;
  border: none;
  border-radius: 7px;
  background: #123c69;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

.checkout {
  background: #b3261e;
}

.reportButton {
  background: #176b2c;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  display: none;
  background: #e6f4ea;
  color: #176b2c;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  border: 1px solid #ccc;
  padding: 10px;
  text-align: left;
  font-size: 14px;
}

th {
  background: #123c69;
  color: white;
}

.no-record {
  text-align: center;
  padding: 15px;
  color: #777;
}

@media(max-width:600px) {
  th, td {
    font-size: 11px;
    padding: 7px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Staff Attendance System</h1>
  <p>Staff Check-In, Check-Out & Daily Report</p>
</header>

<div class="container">

<!-- CHECK IN -->

<div class="card">

<h2>Staff Check-In</h2>

<label>Staff Name</label>

<input
  type="text"
  id="name"
  placeholder="Enter staff name"
>

<label>Staff ID</label>

<input
  type="text"
  id="staffId"
  placeholder="Enter staff ID"
>

<button onclick="checkIn()">
  CHECK IN
</button>

<div id="inMessage" class="message"></div>

</div>


<!-- CHECK OUT -->

<div class="card">

<h2>Staff Check-Out</h2>

<label>Staff ID</label>

<input
  type="text"
  id="outId"
  placeholder="Enter staff ID"
>

<button
  class="checkout"
  onclick="checkOut()"
>
  CHECK OUT
</button>

<div id="outMessage" class="message"></div>

</div>


<!-- REPORT -->

<div class="card">

<h2>Daily Staff Report</h2>

<button
  class="reportButton"
  onclick="showReport()"
>
  SHOW DAILY REPORT
</button>

<div id="report">
  <div class="no-record">
    Tap "SHOW DAILY REPORT" to view attendance.
  </div>
</div>

</div>

</div>


<script>

/* =========================
   ATTENDANCE STORAGE
========================= */

function getRecords() {

  let saved =
    localStorage.getItem("staffAttendance");

  if (saved === null) {
    return [];
  }

  return JSON.parse(saved);
}


function saveRecords(records) {

  localStorage.setItem(
    "staffAttendance",
    JSON.stringify(records)
  );

}


/* =========================
   DATE & TIME
========================= */

function getDate() {

  let now = new Date();

  return now.toLocaleDateString();

}


function getTime() {

  let now = new Date();

  return now.toLocaleTimeString();

}


/* =========================
   CHECK IN
========================= */

function checkIn() {

  let name =
    document.getElementById("name").value.trim();

  let staffId =
    document.getElementById("staffId").value.trim();

  let message =
    document.getElementById("inMessage");


  if (name === "" || staffId === "") {

    alert("Please enter Staff Name and Staff ID.");

    return;

  }


  let records = getRecords();

  let today = getDate();


  /* Check for existing check-in */

  let existing =
    records.find(function(record) {

      return (
        record.staffId === staffId &&
        record.date === today
      );

    });


  if (existing) {

    alert(
      "This staff member has already checked in today."
    );

    return;

  }


  /* Create new attendance record */

  let newRecord = {

    name: name,

    staffId: staffId,

    date: today,

    checkIn: getTime(),

    checkOut: "",

    status: "Present"

  };


  records.push(newRecord);

  saveRecords(records);


  message.style.display = "block";

  message.innerHTML =
    "✓ " + name +
    " successfully checked in at " +
    newRecord.checkIn;


  /* Clear form */

  document.getElementById("name").value = "";

  document.getElementById("staffId").value = "";


  /* Automatically show report */

  showReport();

}


/* =========================
   CHECK OUT
========================= */

function checkOut() {

  let staffId =
    document.getElementById("outId").value.trim();

  let message =
    document.getElementById("outMessage");


  if (staffId === "") {

    alert("Please enter Staff ID.");

    return;

  }


  let records = getRecords();

  let today = getDate();


  /* Find staff record */

  let record =
    records.find(function(item) {

      return (
        item.staffId === staffId &&
        item.date === today
      );

    });


  if (!record) {

    alert(
      "No check-in record found for this Staff ID today."
    );

    return;

  }


  if (record.checkOut !== "") {

    alert(
      "This staff member has already checked out today."
    );

    return;

  }


  record.checkOut = getTime();

  saveRecords(records);


  message.style.display = "block";

  message.innerHTML =
    "✓ Staff " +
    staffId +
    " successfully checked out at " +
    record.checkOut;


  document.getElementById("outId").value = "";


  /* Automatically show report */

  showReport();

}


/* =========================
   DAILY REPORT
========================= */

function showReport() {

  let report =
    document.getElementById("report");

  let records = getRecords();

  let today = getDate();


  let todayRecords =
    records.filter(function(record) {

      return record.date === today;

    });


  if (todayRecords.length === 0) {

    report.innerHTML =

      '<div class="no-record">' +
      'No attendance records for today.' +
      '</div>';

    return;

  }


  let html =

    "<table>" +

    "<tr>" +

    "<th>Staff Name</th>" +
    "<th>Staff ID</th>" +
    "<th>Date</th>" +
    "<th>Arrival</th>" +
    "<th>Closing</th>" +
    "<th>Status</th>" +

    "</tr>";


  todayRecords.forEach(function(record) {

    html +=

      "<tr>" +

      "<td>" +
      record.name +
      "</td>" +

      "<td>" +
      record.staffId +
      "</td>" +

      "<td>" +
      record.date +
      "</td>" +

      "<td>" +
      record.checkIn +
      "</td>" +

      "<td>" +
      (
        record.checkOut === ""
        ? "Not checked out"
        : record.checkOut
      ) +
      "</td>" +

      "<td>" +
      record.status +
      "</td>" +

      "</tr>";

  });


  html += "</table>";


  report.innerHTML = html;

}

</script>

</body>
</html>
